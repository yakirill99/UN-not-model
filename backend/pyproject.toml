[project]
name = "arena"
version = "0.1.0"
description = "World Arena — turn-based multiplayer UN diplomacy strategy game (engine, API, simulation)"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "polars>=1.44.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
analytics = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]

# --- ruff --------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# --- mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "arena.engine.*"
strict = true

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not balance'"
markers = [
    "balance: slow statistical balance checks (nightly CI)",
    "golden: snapshot tests of fixed games",
    "replay: replays of real games",
]

[tool.coverage.run]
source = ["arena"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
