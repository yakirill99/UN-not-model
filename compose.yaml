# Local development services. Sprint 4: database only; sprint 6 adds api and web.
#   just db-up            (= docker compose up -d db)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
